name: Workspace Quality

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/sync-version.mjs"
      - "VERSION"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/sync-version.mjs"
      - "VERSION"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Frontend and backend checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # apps/desktop is a Tauri crate; `pnpm check` runs `cargo check` for it.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks
        run: pnpm check

      - name: Run workspace tests
        run: pnpm test

      # Dependency advisories. `pnpm audit` fails on high/critical; cargo-audit
      # fails on vulnerabilities but only warns on unmaintained crates (Tauri's
      # GTK bindings pull a few in and there is nothing to do about it here).
      - name: Audit npm dependencies
        run: pnpm audit --audit-level high

      - name: Audit Rust dependencies
        run: cargo install cargo-audit --locked && cargo audit --file apps/desktop/src-tauri/Cargo.lock
